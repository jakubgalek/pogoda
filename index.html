<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1419">
<title>Stacja pogodowa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>">
<style>
  :root {
    --bg: #0f1419;
    --surface: #171d25;
    --surface-2: #1e2630;
    --border: #2a3441;
    --text: #e8edf3;
    --muted: #8593a3;
    --accent: #5ab0ff;
    --ok: #4cd694;
    --warn: #ffc247;
    --bad: #ff6b6b;
    --grid: #232c38;
    --cursor: rgba(232,237,243,.35);
    --tip-bg: rgba(15,20,25,.94);
    --msg-bg: rgba(23,29,37,.7);
    --cloud: #d5dde7;
    --cloud-dark: #8a98aa;
    --moon: #f3e9b8;
    --star: #ffffff;
  }
  [data-theme="light"] {
    --bg: #f3f6fa;
    --surface: #ffffff;
    --surface-2: #edf2f7;
    --border: #d7e0ea;
    --text: #16202a;
    --muted: #5c6b7a;
    --accent: #1d76d2;
    --ok: #169c5b;
    --warn: #d98200;
    --bad: #dc3545;
    --grid: #e3e9f0;
    --cursor: rgba(22,32,42,.35);
    --tip-bg: rgba(255,255,255,.96);
    --msg-bg: rgba(255,255,255,.75);
    --cloud: #9aa7b8;
    --cloud-dark: #6c7a8c;
    --moon: #e0b84c;
    --star: #7b8a9c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  @media (min-width: 900px) { html { font-size: 17.5px; } }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    line-height: 1.4;
    transition: background .25s, color .25s;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  @media (min-width: 900px) { .wrap { max-width: 1080px; } }

  /* Nagłówek */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 4px 2px 16px;
  }
  header h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: .2px; }
  header h1 small { display: block; font-size: .72rem; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .head-right { display: flex; align-items: center; gap: 8px; }
  .theme-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); border-radius: 999px; cursor: pointer;
    transition: background .2s, color .2s, border-color .2s;
  }
  .theme-btn:hover { color: var(--text); border-color: var(--accent); }
  .theme-btn svg { width: 15px; height: 15px; }
  .status {
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
    font-size: .75rem; color: var(--muted);
    background: var(--surface); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 999px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); transition: background .3s; }
  .status.online .dot { background: var(--ok); animation: pulse 2s infinite; }
  .status.stale .dot { background: var(--warn); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(76,214,148,.5); }
    70% { box-shadow: 0 0 0 7px rgba(76,214,148,0); }
    100% { box-shadow: 0 0 0 0 rgba(76,214,148,0); }
  }

  /* Karty */
  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 640px) {
    .grid { grid-template-columns: 1fr 1fr; grid-auto-flow: dense; }
    .card-outdoor { order: 2; }
    .card-indoor { order: 1; }
    .card-indoor .hero { min-height: 5.125rem; }   /* kafelki w linii z tymi po stronie "Na zewnątrz" (tam wysokość nadaje ikona pogody) */
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    transition: background .25s, border-color .25s;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card-title {
    display: flex; align-items: center; gap: 8px;
    font-size: .8rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted);
  }
  .card-title svg { width: 16px; height: 16px; }

  .hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; min-height: 60px; }
  .hero-val { display: flex; align-items: baseline; gap: 2px; }
  .hero-val .num { font-size: 3.2rem; font-weight: 200; line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .hero-val .deg { font-size: 1.4rem; color: var(--muted); font-weight: 300; }
  .hero-label { font-size: .75rem; color: var(--muted); margin-top: 4px; }
  /* Ikona pogody po drugiej stronie kafelka: ikona na wysokości cyfr, opis pod nią (w linii z podpisem "Temperatura") */
  .wx { display: flex; flex-direction: column; align-items: center; }
  .wx[hidden] { display: none; }
  .wx svg { flex: none; width: 56px; height: 56px; margin: -2.4px 0; overflow: visible; }
  .wx span { margin-top: 4px; max-width: 9em; text-align: center; line-height: 1.25; font-size: .75rem; color: var(--muted); }
  .wx .spin { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
  .wx .bob { animation: bob 6s ease-in-out infinite; }
  .wx .twinkle { animation: twinkle 3s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .wx * { animation: none !important; } }

  .card { display: flex; flex-direction: column; }
  .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: auto; }   /* kafelki zawsze przy dolnej krawędzi karty, więc obie karty mają je w jednej linii */
  .metric { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; transition: background .25s; }
  .metric .lbl {
    display: flex; align-items: center; gap: 6px;
    font-size: .68rem; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
    margin-bottom: 4px;
  }
  .metric .lbl svg { width: 13px; height: 13px; }
  .metric .val { font-size: 1.15rem; font-weight: 500; font-variant-numeric: tabular-nums; }
  .metric .val small { font-size: .72rem; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .metric.wide { grid-column: 1 / -1; }

  /* Bateria jako chip w nagłówku kafelka (jak w rogu ekranu OLED): 4 segmenty + procent + napięcie */
  .batt {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums;
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 4px 10px 4px 8px; border-radius: 999px; white-space: nowrap;
    transition: background .25s, border-color .25s;
  }
  .batt svg { width: 24px; height: 12px; flex: none; }
  .batt .shell { fill: none; stroke: var(--muted); stroke-width: 1; }
  .batt .tip { fill: var(--muted); }
  .batt .seg { fill: var(--border); transition: fill .3s; }
  .batt .seg.on { fill: var(--ok); }
  .batt.l2 .seg.on { fill: var(--warn); }
  .batt.l1 .seg.on { fill: var(--bad); }
  .batt .bp { color: var(--text); font-weight: 600; }
  .batt.low { animation: blink 1s ease-in-out infinite; }
  .batt.low .bp { color: var(--bad); }
  .bar.hum > i { background: #2f8cff; }

  .bar { height: 6px; border-radius: 999px; background: var(--border); margin-top: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--ok); transition: width .6s ease, background .3s; }
  .battery-low { color: var(--bad); animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  /* Wykresy */
  .charts-head {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    margin: 28px 2px 12px;
  }
  .charts-head h2 { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .range { display: inline-flex; max-width: 100%; overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; scrollbar-width: none; }
  .range::-webkit-scrollbar { display: none; }
  .range button { white-space: nowrap; }
  .range button {
    font: inherit; font-size: .75rem; font-weight: 500;
    color: var(--muted); background: transparent; border: 0; border-radius: 999px;
    padding: 5px 14px; cursor: pointer; transition: background .2s, color .2s;
  }
  .range button:hover { color: var(--text); }
  .range button.active { background: var(--accent); color: #ffffff; }

  .chart-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 720px) { .chart-grid { grid-template-columns: 1fr 1fr; } }

  .chart {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 14px 10px;
    min-width: 0;
    transition: background .25s, border-color .25s;
  }
  .chart-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .chart-top h3 { font-size: .8rem; font-weight: 600; color: var(--text); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .72rem; color: var(--muted); }
  .legend .it { display: inline-flex; align-items: baseline; gap: 6px; }
  .legend .it.toggleable { cursor: pointer; user-select: none; padding: 2px 6px; margin: -2px -6px; border-radius: 6px; transition: opacity .2s, background .2s; }
  .legend .it.toggleable:hover { background: var(--surface-2); }
  .legend .it.off { opacity: .42; text-decoration: line-through; }
  .legend .sw { width: 8px; height: 8px; border-radius: 50%; align-self: center; }
  .legend b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .legend em { font-style: normal; font-size: .66rem; opacity: .85; font-variant-numeric: tabular-nums; }

  .chart-wrap { position: relative; height: 210px; }
  @media (min-width: 900px) { .chart-wrap { height: 230px; } }
  .chart-wrap canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; cursor: crosshair; }
  .tip {
    position: absolute; top: 6px; display: none; pointer-events: none; z-index: 2;
    background: var(--tip-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 9px; font-size: .72rem; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  .tip .t { color: var(--muted); margin-bottom: 3px; }
  .tip .r { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .tip .r i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .tip .r b { margin-left: auto; padding-left: 10px; font-weight: 600; }
  .msg {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: .78rem; color: var(--muted); background: var(--msg-bg); border-radius: 10px;
  }

</style>
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Stacja pogodowa<small id="last-update">Ładowanie danych…</small></h1>
    <div class="head-right">
      <button class="theme-btn" id="theme-toggle" type="button" title="Przełącz motyw" aria-label="Przełącz motyw"></button>
      <div class="status" id="status"><span class="dot"></span><span id="status-text">Offline</span></div>
    </div>
  </header>

  <div class="grid">

    <!-- NA ZEWNĄTRZ -->
    <section class="card card-outdoor">
      <div class="card-head">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V12"/><path d="M12 12c-4 0-6-2.5-6-6 4 0 6 2.5 6 6z"/><path d="M12 15c4 0 6-2.5 6-6-4 0-6 2.5-6 6z"/></svg>
          Na zewnątrz
        </div>
        <div class="batt" id="out-batt" title="Bateria – brak danych"><svg viewBox="0 0 24 12" aria-hidden="true"><rect class="shell" x=".5" y=".5" width="20" height="11" rx="2"/><rect class="tip" x="21.5" y="4" width="2" height="4" rx=".5"/><rect class="seg" x="2.5" y="2.5" width="3.5" height="7" rx=".6"/><rect class="seg" x="7" y="2.5" width="3.5" height="7" rx=".6"/><rect class="seg" x="11.5" y="2.5" width="3.5" height="7" rx=".6"/><rect class="seg" x="16" y="2.5" width="3.5" height="7" rx=".6"/></svg><span class="bp">--</span><span class="bv"></span></div>
      </div>
      <div class="hero">
        <div>
          <div class="hero-val"><span class="num" id="outside_temperature">--</span><span class="deg">°C</span></div>
          <div class="hero-label">Temperatura</div>
        </div>
        <div class="wx" id="weather" hidden></div>
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="lbl">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2f8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
            Wilgotność
          </div>
          <div class="val"><span id="outside_humidity">--</span><small>%</small></div>
        </div>
        <div class="metric">
          <div class="lbl">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2fb5a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9.5 14.5a2.7 2.7 0 0 0 2.5 2.5"/></svg>
            Punkt rosy
          </div>
          <div class="val"><span id="outside_dew">--</span><small>°C</small></div>
        </div>
      </div>
    </section>

    <!-- W DOMU -->
    <section class="card card-indoor">
      <div class="card-head">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          W domu
        </div>
        <div class="batt" id="in-batt" title="Bateria – brak danych"><svg viewBox="0 0 24 12" aria-hidden="true"><rect class="shell" x=".5" y=".5" width="20" height="11" rx="2"/><rect class="tip" x="21.5" y="4" width="2" height="4" rx=".5"/><rect class="seg" x="2.5" y="2.5" width="3.5" height="7" rx=".6"/><rect class="seg" x="7" y="2.5" width="3.5" height="7" rx=".6"/><rect class="seg" x="11.5" y="2.5" width="3.5" height="7" rx=".6"/><rect class="seg" x="16" y="2.5" width="3.5" height="7" rx=".6"/></svg><span class="bp">--</span><span class="bv"></span></div>
      </div>
      <div class="hero">
        <div>
          <div class="hero-val"><span class="num" id="temperature">--</span><span class="deg">°C</span></div>
          <div class="hero-label">Temperatura</div>
        </div>
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="lbl">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2f8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
            Wilgotność
          </div>
          <div class="val"><span id="humidity">--</span><small>%</small></div>
        </div>
        <div class="metric">
          <div class="lbl">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 12l4-4"/><path d="M12 6v1M18 12h-1M6 12h1"/></svg>
            Ciśnienie
          </div>
          <div class="val"><span id="pressure">--</span><small>hPa</small></div>
        </div>
      </div>
    </section>

  </div>

  <!-- WYKRESY -->
  <div class="charts-head">
    <h2>Wykresy</h2>
    <div class="range" id="range">
      <button data-days="1">24 h</button>
      <button data-days="7" class="active">7 dni</button>
      <button data-days="30">30 dni</button>
      <button data-days="183">6 mies.</button>
      <button data-days="365">Rok</button>
      <button data-days="1825">5 lat</button>
    </div>
  </div>

  <div class="chart-grid" id="charts"></div>

</div>

<script>
  var CHANNEL = 2917455;
  var STALE_MIN = 5;     // po ilu minutach bez nowych danych pokazać "Brak nowych danych" (żółta kropka)
  var hasData = false;   // czy udało się już pobrać jakikolwiek pomiar
  var OFFLINE_MIN = 30;  // po ilu minutach bez danych uznać stację za wyłączoną: "Offline" (czerwona kropka)
  var days = 7;

  /* =====================================================
     Pomocnicze
     ===================================================== */
  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function num(v) { var n = parseFloat(v); return isNaN(n) ? null : n; }
  function fmt(v) {
    var n = parseFloat(v);
    return isNaN(n) ? '--' : String(Math.round(n));   // 0 °C też jest poprawną wartością
  }
  function hexToRgba(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function fmtDate(t, withTime, withYear) {
    var d = new Date(t);
    var s = pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + (withYear ? '.' + d.getFullYear() : '');
    return withTime ? s + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : s;
  }
  function fmtHour(t) { var d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function setStatus(state, text) {
    $('status').className = 'status ' + state;
    $('status-text').textContent = text;
  }

  /* =====================================================
     Motyw jasny / ciemny
     ===================================================== */
  var SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
  var MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

  function applyTheme(theme) {
    var isLight = theme === 'light';
    if (isLight) document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', isLight ? '#f3f6fa' : '#0f1419');
    var btn = $('theme-toggle');
    if (btn) {
      btn.innerHTML = isLight ? MOON_ICON : SUN_ICON;
      btn.title = isLight ? 'Przełącz na motyw ciemny' : 'Przełącz na motyw jasny';
      btn.setAttribute('aria-label', btn.title);
    }
    if (typeof renderWeather === 'function') renderWeather();
    if (typeof chartObjs !== 'undefined') chartObjs.forEach(function (c) { c.draw(); });
  }

  $('theme-toggle').addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('theme', next); } catch (e) {}
    applyTheme(next);
  });

  /* =====================================================
     Bateria / ikona pogody
     ===================================================== */
  function liIonPercent(v) {
    // Krzywa rozładowania Li-ion 18650
    var curve = [
      [4.20, 100], [4.15, 100], [4.05, 95], [3.95, 85], [3.85, 75], [3.75, 60],
      [3.65, 45],  [3.55, 30],  [3.45, 20], [3.35, 10], [3.20, 5],  [3.00, 0]
    ];
    if (v >= 999 || v < 2.5) return null;
    for (var i = 0; i < curve.length - 1; i++) {
      var v1 = curve[i][0], p1 = curve[i][1], v2 = curve[i + 1][0], p2 = curve[i + 1][1];
      if (v >= v2 && v <= v1) return Math.round(p2 + (p1 - p2) * (v - v2) / (v1 - v2));
    }
    return v >= 4.20 ? 100 : 0;
  }

  // Chip baterii: cztery poziomy jak na OLED (>75% = 4, >50% = 3, >25% = 2, reszta = 1); zwraca procent
  function renderBattery(chip, volts) {
    var pct = liIonPercent(volts);
    var level = pct === null ? 0 : (pct > 75 ? 4 : (pct > 50 ? 3 : (pct > 25 ? 2 : 1)));
    var segs = chip.querySelectorAll('.seg');
    for (var i = 0; i < segs.length; i++) segs[i].classList.toggle('on', i < level);
    chip.className = 'batt' + (level ? ' l' + level : '') + (pct !== null && pct < 10 ? ' low' : '');
    chip.querySelector('.bp').textContent = pct === null ? '--' : pct + '%';
    chip.querySelector('.bv').textContent = pct === null ? '' : volts.toFixed(2) + ' V';
    chip.title = pct === null ? 'Bateria – brak danych' : 'Bateria: ' + pct + '% · ' + volts.toFixed(2) + ' V';
    return pct;
  }

  /* ---------- Generowana ikona pogody ---------- */
  var LAT = 52.0, LON = 19.5;   // ustaw swoją lokalizację – służy do rozpoznania dnia i nocy
  var pressureTrend = null;     // zmiana ciśnienia w ostatnich ~3 h [hPa]
  var lastWx = null;

  function isNight(date) {
    var rad = Math.PI / 180;
    var N = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
    var B = 360 / 365 * (N - 81) * rad;
    var decl = 23.44 * Math.sin(B) * rad;
    var cosH = Math.max(-1, Math.min(1, -Math.tan(LAT * rad) * Math.tan(decl)));
    var half = Math.acos(cosH) / rad / 15;                                  // pół długości dnia [h]
    var eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B); // równanie czasu [min]
    var noon = 12 - LON / 15 - eot / 60;                                    // południe słoneczne [h UTC]
    var h = date.getUTCHours() + date.getUTCMinutes() / 60;
    return h < noon - half || h > noon + half;
  }

  function dewPoint(temp, hum) {
    if (isNaN(temp) || isNaN(hum)) return NaN;
    var gamma = Math.log(Math.max(hum, 1) / 100) + 17.62 * temp / (243.12 + temp);
    return 243.12 * gamma / (17.62 - gamma);
  }

  // Szacunek zachmurzenia z temperatury, wilgotności, pory dnia i ciśnienia.
  // Opadów celowo NIE rozpoznajemy – wilgotność nie mówi, czy aktualnie pada.
  function classifyWeather(w, night) {
    // Punkt rosy (wzór Magnusa): im bliżej temperatury powietrza, tym niższa podstawa chmur
    var gamma = Math.log(Math.max(w.hum, 1) / 100) + 17.62 * w.temp / (243.12 + w.temp);
    var dew = 243.12 * gamma / (17.62 - gamma);
    var spread = w.temp - dew;                                   // 0 °C = powietrze nasycone
    var c = 1 - (spread - 0.5) / 6;                              // 0 = bezchmurnie, 1 = całkowite zachmurzenie

    if (night) c -= 0.15;                                        // w nocy wilgotność rośnie też przy czystym niebie
    if (w.pres !== null) { if (w.pres >= 1020) c -= 0.15; else if (w.pres < 1005) c += 0.15; }
    if (pressureTrend !== null) { if (pressureTrend <= -2) c += 0.2; else if (pressureTrend >= 2) c -= 0.15; }
    c = Math.max(0, Math.min(1, c));

    var kind, label;

    if (c >= 0.75) { kind = 'cloudy'; label = 'Pochmurno'; }
    else if (c >= 0.3)  { kind = 'partly'; label = 'Częściowe zachmurzenie'; }
    else {
      kind = 'clear';
      label = night ? 'Bezchmurnie' : (w.temp >= 28 ? 'Upalnie' : (w.temp <= -8 ? 'Mroźnie' : 'Słonecznie'));
    }
    return { kind: kind, label: label };
  }

  function weatherSvg(kind, night, temp, standalone) {
    var CL = standalone ? '#d5dde7' : (cssVar('--cloud') || '#d5dde7');
    var CLD = standalone ? '#8a98aa' : (cssVar('--cloud-dark') || '#8a98aa');
    var MOON = standalone ? '#f3e9b8' : (cssVar('--moon') || '#f3e9b8');
    var STAR = standalone ? '#ffffff' : (cssVar('--star') || '#ffffff');
    var SUN = temp >= 28 ? '#ff8a3d' : '#ffc247';

    function cloud(fill, tr) {
      return '<g transform="' + tr + '"><g class="bob" fill="' + fill + '">' +
        '<circle cx="23" cy="41" r="8"/><circle cx="34" cy="33" r="11"/><circle cx="45" cy="40" r="9"/>' +
        '<rect x="23" y="41" width="22" height="8"/></g></g>';
    }
    function sun(cx, cy, r, a, b) {
      var s = '<g class="spin" stroke="' + SUN + '" stroke-width="3" stroke-linecap="round">';
      for (var i = 0; i < 8; i++) {
        var ang = i * Math.PI / 4, ca = Math.cos(ang), sa = Math.sin(ang);
        s += '<line x1="' + (cx + ca * a).toFixed(1) + '" y1="' + (cy + sa * a).toFixed(1) +
             '" x2="' + (cx + ca * b).toFixed(1) + '" y2="' + (cy + sa * b).toFixed(1) + '"/>';
      }
      return s + '</g><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + SUN + '"/>';
    }
    function moon(tr) {
      return '<path transform="' + tr + '" fill="' + MOON + '" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    }
    function stars() {
      return '<circle class="twinkle" cx="52" cy="14" r="1.8" fill="' + STAR + '"/>' +
             '<circle class="twinkle" cx="56" cy="30" r="1.3" fill="' + STAR + '" style="animation-delay:.8s"/>' +
             '<circle class="twinkle" cx="12" cy="12" r="1.3" fill="' + STAR + '" style="animation-delay:1.6s"/>';
    }

    var inner = '';
    if (kind === 'clear') {
      inner = night ? moon('translate(8 6) scale(2)') + stars() : sun(32, 32, 10, 15, 23);
    } else if (kind === 'partly') {
      inner = (night ? moon('translate(4 5) scale(1.5)') : sun(23, 23, 8, 12, 17)) + cloud(CL, 'translate(8 12) scale(.85)');
    } else if (kind === 'cloudy') {
      inner = cloud(CLD, 'translate(12 -6) scale(.8)') + cloud(CL, 'translate(-2 6) scale(.95)');
    }
    return '<svg ' + (standalone ? 'xmlns="http://www.w3.org/2000/svg" ' : '') + 'viewBox="0 0 64 64" aria-hidden="true">' + inner + '</svg>';
  }

  function renderWeather() {
    var el = $('weather'), fav = document.querySelector('link[rel=icon]');
    if (!lastWx || isNaN(lastWx.temp) || isNaN(lastWx.hum)) {
      el.hidden = true;
      document.title = 'Stacja pogodowa';
      return;
    }
    var night = isNight(new Date());
    var w = classifyWeather(lastWx, night);
    el.innerHTML = weatherSvg(w.kind, night, lastWx.temp, false) + '<span>' + w.label + '</span>';
    el.hidden = false;
    el.title = 'Szacunek zachmurzenia z temperatury, wilgotności, pory dnia i ciśnienia (bez opadów)';
    document.title = Math.round(lastWx.temp) + '°C · Stacja pogodowa';
    if (fav) fav.href = 'data:image/svg+xml,' + encodeURIComponent(weatherSvg(w.kind, night, lastWx.temp, true));
  }

  // Trend ciśnienia z ostatnich ~3 godzin (poprawia szacowanie zachmurzenia)
  function updateTrend() {
    fetch('https://api.thingspeak.com/channels/' + CHANNEL + '/fields/5.json?minutes=190&median=10')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var first = null, last = null;
        (d.feeds || []).forEach(function (f) {
          var v = num(f.field5);
          if (v === null || v <= 0) return;
          var p = { t: new Date(f.created_at).getTime(), v: v };
          if (!first) first = p;
          last = p;
        });
        pressureTrend = (first && last && last.t - first.t >= 90 * 60000)
          ? (last.v - first.v) * (180 * 60000) / (last.t - first.t) : null;
        renderWeather();
      })
      .catch(function () {});
  }

  /* =====================================================
     Aktualne dane
     ===================================================== */
  // Offline: zamiast ostatnich (nieaktualnych) wartości pokazujemy "--", baterie bez danych i brak ikony pogody
  function clearValues() {
    ['temperature', 'humidity', 'pressure', 'outside_temperature', 'outside_humidity', 'outside_dew'].forEach(function (id) {
      $(id).textContent = '--';
    });
    renderBattery($('out-batt'), 999);
    renderBattery($('in-batt'), 999);
    lastWx = null;
    renderWeather();
  }

  function updateData() {
    fetch('https://api.thingspeak.com/channels/' + CHANNEL + '/feeds.json?results=1')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.feeds || !data.feeds.length) return;
        var f = data.feeds[0];

        // Ostatni pomiar sprzed dłuższego czasu = stacja wyłączona: nie pokazujemy starych wartości
        var t = new Date(f.created_at);
        var ageMin = (Date.now() - t.getTime()) / 60000;
        if (ageMin > OFFLINE_MIN) {
          clearValues();
          hasData = true;
          $('last-update').textContent = 'Ostatni pomiar: ' + t.toLocaleString('pl-PL');
          setStatus('', 'Offline');
          return;
        }

        $('temperature').textContent = fmt(f.field1);
        $('humidity').textContent    = fmt(f.field2);
        $('pressure').textContent    = fmt(f.field5);

        // Niższe z dwóch napięć (0 / brak = nieprawidłowe)
        var v1 = parseFloat(f.field6) || 999;
        var v2 = parseFloat(f.field7) || 999;
        var vMin = Math.min(v1, v2);
        var pct = liIonPercent(vMin);

        // Brak napięcia = brak odbioru z czujnika zewnętrznego, więc nie pokazujemy zer
        var rf = pct !== null;
        var outTemp = rf ? parseFloat(f.field3) : NaN;
        var outHum  = rf ? parseFloat(f.field4) : NaN;
        $('outside_temperature').textContent = fmt(outTemp);
        $('outside_humidity').textContent    = fmt(outHum);
        $('outside_dew').textContent         = fmt(dewPoint(outTemp, outHum));

        renderBattery($('out-batt'), vMin);

        // Bateria stacji domowej (field8 z A0) – ten sam kafelek co na zewnątrz; bez pola pokazuje "--"
        var v8 = parseFloat(f.field8);
        renderBattery($('in-batt'), (v8 > 2 && v8 < 6) ? v8 : 999);

        var pr = num(f.field5);
        lastWx = { temp: outTemp, hum: outHum, pres: (pr !== null && pr > 0) ? pr : null };
        renderWeather();

        hasData = true;
        $('last-update').textContent = 'Ostatni pomiar: ' + t.toLocaleString('pl-PL');
        if (ageMin > STALE_MIN) setStatus('stale', 'Brak nowych danych');
        else setStatus('online', 'Online');
      })
      .catch(function (err) {
        console.error('Błąd pobierania danych:', err);
        // Brak połączenia = po prostu Offline; podpis zostaje przy ostatnim znanym pomiarze
        if (!hasData) $('last-update').textContent = 'Brak danych';
        clearValues();
        setStatus('', 'Offline');
      });
  }

  /* =====================================================
     Wykresy (canvas, bez bibliotek)
     ===================================================== */
  var CHARTS = [
    { title: 'Temperatura', unit: ' °C', dec: 1, minSpan: 4, series: [
        { k: 'tOut', l: 'Na zewnątrz',  c: '#ff5a36', toggleable: true },
        { k: 'tIn',  l: 'W domu',       c: '#d97b62', toggleable: true } ] },
    { title: 'Wilgotność', unit: ' %', dec: 0, minSpan: 10, series: [
        { k: 'hOut', l: 'Na zewnątrz',  c: '#2f8cff', toggleable: true },
        { k: 'hIn',  l: 'W domu',       c: '#6e9cd4', toggleable: true } ] },
    { title: 'Ciśnienie', unit: ' hPa', dec: 0, minSpan: 6, series: [
        { k: 'p',    l: 'Ciśnienie',    c: '#8a72f5' } ] },
    { title: 'Napięcie baterii', unit: ' V', dec: 2, minSpan: 0.3, series: [
        { k: 'v1',   l: 'Zewn. A1',     c: '#E0B422', toggleable: true },
        { k: 'v2',   l: 'Zewn. A2',     c: '#9E6E00', toggleable: true },
        { k: 'v3',   l: 'Stacja',       c: '#22b573', toggleable: true } ] }
  ];

  // Mediana w oknach czasowych (odporna na zera, gdy brak odbioru RF)
  var MEDIAN = { 1: 10, 7: 60, 30: 240, 183: 240, 365: 720, 1825: 1440 };

  function Chart(cfg, parent) {
    var self = this;
    this.cfg = cfg;
    this.rows = [];
    this.hover = null;
    this.stepMs = 3600000;
    this.storageKey = 'chart_hidden_' + cfg.title;
    this.hidden = {};
    try {
      var saved = JSON.parse(localStorage.getItem(this.storageKey));
      if (saved && typeof saved === 'object') this.hidden = saved;
    } catch (e) {}

    var el = document.createElement('div');
    el.className = 'chart';
    el.innerHTML =
      '<div class="chart-top"><h3>' + cfg.title + '</h3><div class="legend"></div></div>' +
      '<div class="chart-wrap"><canvas></canvas><div class="tip"></div><div class="msg"></div></div>';
    parent.appendChild(el);

    this.legend = el.querySelector('.legend');
    this.wrap   = el.querySelector('.chart-wrap');
    this.canvas = el.querySelector('canvas');
    this.tip    = el.querySelector('.tip');
    this.msg    = el.querySelector('.msg');
    this.ctx    = this.canvas.getContext('2d');

    this.canvas.addEventListener('pointermove', function (e) { self.onMove(e); });
    this.canvas.addEventListener('pointerdown', function (e) { self.onMove(e); });
    this.canvas.addEventListener('pointerleave', function () { self.hover = null; self.tip.style.display = 'none'; self.draw(); });
    this.legend.addEventListener('click', function (e) {
      var item = e.target.closest('.it.toggleable');
      if (!item) return;
      var k = item.getAttribute('data-k');
      self.hidden[k] = !self.hidden[k];
      try { localStorage.setItem(self.storageKey, JSON.stringify(self.hidden)); } catch (err) {}
      self.buildLegend(self.rows.length > 0);
      self.draw();
    });
    this.buildLegend(null);
  }

  Chart.prototype.showMsg = function (text) {
    this.msg.textContent = text || '';
    this.msg.style.display = text ? 'flex' : 'none';
  };

  Chart.prototype.setData = function (rows, stepMs) {
    this.rows = rows;
    this.stepMs = stepMs;
    this.hover = null;
    this.tip.style.display = 'none';
    this.buildLegend(true);
    this.draw();
  };

  Chart.prototype.fmtVal = function (v) {
    return v === null || v === undefined ? '--' : v.toFixed(this.cfg.dec) + this.cfg.unit;
  };

  Chart.prototype.buildLegend = function (hasData) {
    var html = '';
    for (var s = 0; s < this.cfg.series.length; s++) {
      var se = this.cfg.series[s], last = null, mn = Infinity, mx = -Infinity;
      if (hasData) {
        for (var i = 0; i < this.rows.length; i++) {
          var v = this.rows[i][se.k];
          if (v === null) continue;
          last = v; if (v < mn) mn = v; if (v > mx) mx = v;
        }
      }
      var range = last === null ? '' :
        '<em>' + mn.toFixed(this.cfg.dec) + ' – ' + mx.toFixed(this.cfg.dec) + '</em>';
      var cls = 'it' + (se.toggleable ? ' toggleable' : '') + (this.hidden[se.k] ? ' off' : '');
      var attrs = se.toggleable ? ' data-k="' + se.k + '" title="' + (this.hidden[se.k] ? 'Kliknij, aby pokazać ' : 'Kliknij, aby ukryć ') + se.l + '"' : '';
      html += '<span class="' + cls + '"' + attrs + '><span class="sw" style="background:' + se.c + '"></span>' +
              se.l + ' <b>' + this.fmtVal(last) + '</b> ' + range + '</span>';
    }
    this.legend.innerHTML = html;
  };

  Chart.prototype.geom = function () {
    return { l: 42, r: 10, t: 8, b: 22, w: this.wrap.clientWidth, h: this.wrap.clientHeight };
  };

  Chart.prototype.yRange = function () {
    var mn = Infinity, mx = -Infinity;
    for (var i = 0; i < this.rows.length; i++) {
      for (var s = 0; s < this.cfg.series.length; s++) {
        if (this.hidden[this.cfg.series[s].k]) continue;
        var v = this.rows[i][this.cfg.series[s].k];
        if (v === null) continue;
        if (v < mn) mn = v; if (v > mx) mx = v;
      }
    }
    if (mn === Infinity) return null;
    var span = mx - mn;
    if (span < this.cfg.minSpan) {
      var mid = (mx + mn) / 2;
      mn = mid - this.cfg.minSpan / 2; mx = mid + this.cfg.minSpan / 2; span = this.cfg.minSpan;
    }
    return { min: mn - span * 0.08, max: mx + span * 0.08 };
  };

  Chart.prototype.draw = function () {
    var g = this.geom(), ctx = this.ctx, dpr = window.devicePixelRatio || 1;
    if (!g.w || !g.h) return;
    this.canvas.width = Math.round(g.w * dpr);
    this.canvas.height = Math.round(g.h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, g.w, g.h);
    ctx.font = (window.innerWidth >= 900 ? 12 : 11) + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';

    var mutedColor = cssVar('--muted') || '#8593a3';
    var gridColor = cssVar('--grid') || '#232c38';
    var surfaceColor = cssVar('--surface') || '#171d25';
    var cursorColor = cssVar('--cursor') || 'rgba(232,237,243,.35)';

    var rows = this.rows, yr = this.yRange();
    if (!rows.length || !yr) {
      ctx.fillStyle = mutedColor; ctx.textAlign = 'center';
      ctx.fillText('Brak danych', g.w / 2, g.h / 2);
      return;
    }

    var t0 = rows[0].t, t1 = rows[rows.length - 1].t, plotW = g.w - g.l - g.r, plotH = g.h - g.t - g.b;
    if (t1 === t0) t1 = t0 + 1;
    var X = function (t) { return g.l + (t - t0) / (t1 - t0) * plotW; };
    var Y = function (v) { return g.t + (1 - (v - yr.min) / (yr.max - yr.min)) * plotH; };

    // Siatka pozioma + etykiety osi Y
    ctx.strokeStyle = gridColor; ctx.lineWidth = 1;
    ctx.fillStyle = mutedColor; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    var ticks = 4;
    for (var i = 0; i <= ticks; i++) {
      var val = yr.min + (yr.max - yr.min) * i / ticks, y = Math.round(Y(val)) + 0.5;
      ctx.beginPath(); ctx.moveTo(g.l, y); ctx.lineTo(g.w - g.r, y); ctx.stroke();
      ctx.fillText(val.toFixed(this.cfg.dec), g.l - 6, y);
    }

    // Etykiety osi X
    ctx.textBaseline = 'alphabetic';
    var xt = Math.max(2, Math.min(5, Math.floor(plotW / 90)));
    for (var j = 0; j <= xt; j++) {
      var tt = t0 + (t1 - t0) * j / xt;
      ctx.textAlign = j === 0 ? 'left' : (j === xt ? 'right' : 'center');
      ctx.fillText(days <= 1 ? fmtHour(tt) : fmtDate(tt, false, days >= 183), X(tt), g.h - 6);
    }

    // Serie
    var gapMs = this.stepMs * 3;
    for (var s = 0; s < this.cfg.series.length; s++) {
      var se = this.cfg.series[s];
      if (this.hidden[se.k]) continue;
      var segs = [], cur = [], prevT = null;
      for (var r = 0; r < rows.length; r++) {
        var v = rows[r][se.k];
        if (v === null || (prevT !== null && rows[r].t - prevT > gapMs)) {
          if (cur.length) segs.push(cur); cur = [];
        }
        if (v !== null) { cur.push([X(rows[r].t), Y(v)]); prevT = rows[r].t; }
      }
      if (cur.length) segs.push(cur);

      var grad = ctx.createLinearGradient(0, g.t, 0, g.t + plotH);
      grad.addColorStop(0, hexToRgba(se.c, 0.22));
      grad.addColorStop(1, hexToRgba(se.c, 0));

      for (var q = 0; q < segs.length; q++) {
        var sg = segs[q];
        if (sg.length === 1) {
          ctx.fillStyle = se.c; ctx.beginPath(); ctx.arc(sg[0][0], sg[0][1], 2, 0, 6.2832); ctx.fill();
          continue;
        }
        // wypełnienie
        ctx.beginPath(); ctx.moveTo(sg[0][0], g.t + plotH);
        for (var a = 0; a < sg.length; a++) ctx.lineTo(sg[a][0], sg[a][1]);
        ctx.lineTo(sg[sg.length - 1][0], g.t + plotH); ctx.closePath();
        ctx.fillStyle = grad; ctx.fill();
        // linia
        ctx.beginPath(); ctx.moveTo(sg[0][0], sg[0][1]);
        for (var b = 1; b < sg.length; b++) ctx.lineTo(sg[b][0], sg[b][1]);
        ctx.strokeStyle = se.c; ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
      }
    }

    // Kursor
    if (this.hover !== null) {
      var row = rows[this.hover], hx = X(row.t);
      ctx.strokeStyle = cursorColor; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(Math.round(hx) + 0.5, g.t); ctx.lineTo(Math.round(hx) + 0.5, g.t + plotH); ctx.stroke();
      ctx.setLineDash([]);
      for (var k = 0; k < this.cfg.series.length; k++) {
        if (this.hidden[this.cfg.series[k].k]) continue;
        var sv = row[this.cfg.series[k].k];
        if (sv === null) continue;
        ctx.beginPath(); ctx.arc(hx, Y(sv), 4, 0, 6.2832);
        ctx.fillStyle = surfaceColor; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = this.cfg.series[k].c; ctx.stroke();
      }
    }
  };

  Chart.prototype.onMove = function (e) {
    var rows = this.rows;
    if (!rows.length) return;
    var g = this.geom(), rect = this.canvas.getBoundingClientRect();
    var px = e.clientX - rect.left;
    var t0 = rows[0].t, t1 = rows[rows.length - 1].t;
    var t = t0 + (px - g.l) / (g.w - g.l - g.r) * (t1 - t0);

    // wyszukiwanie binarne najbliższego punktu
    var lo = 0, hi = rows.length - 1;
    while (hi - lo > 1) { var m = (lo + hi) >> 1; if (rows[m].t < t) lo = m; else hi = m; }
    var idx = Math.abs(rows[lo].t - t) <= Math.abs(rows[hi].t - t) ? lo : hi;
    this.hover = idx;

    var row = rows[idx], html = '<div class="t">' + fmtDate(row.t, this.stepMs < 86400000, days >= 183) + '</div>';
    for (var s = 0; s < this.cfg.series.length; s++) {
      var se = this.cfg.series[s];
      if (this.hidden[se.k]) continue;
      html += '<div class="r"><i style="background:' + se.c + '"></i>' + se.l + '<b>' + this.fmtVal(row[se.k]) + '</b></div>';
    }
    this.tip.innerHTML = html;
    this.tip.style.display = 'block';

    var hx = g.l + (row.t - t0) / ((t1 - t0) || 1) * (g.w - g.l - g.r);
    var tw = this.tip.offsetWidth;
    var left = hx + 12;
    if (left + tw > g.w) left = hx - tw - 12;
    this.tip.style.left = Math.max(0, left) + 'px';
    this.draw();
  };

  var chartObjs = [];
  var chartReq = 0, chartAbort = null;
  function buildCharts() {
    var root = $('charts');
    for (var i = 0; i < CHARTS.length; i++) chartObjs.push(new Chart(CHARTS[i], root));
  }

  function loadCharts() {
    var med = MEDIAN[days] || 60;
    var url = 'https://api.thingspeak.com/channels/' + CHANNEL + '/feeds.json?days=' + days +
              '&median=' + med + '&round=2&results=8000';
    chartObjs.forEach(function (c) { c.showMsg('Ładowanie…'); });

    var myReq = ++chartReq;
    if (chartAbort) chartAbort.abort();
    var ctrl = window.AbortController ? new AbortController() : null;
    chartAbort = ctrl;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 45000);

    fetch(url, ctrl ? { signal: ctrl.signal } : undefined)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        clearTimeout(timer);
        if (myReq !== chartReq) return;
        var rows = (data.feeds || []).map(function (f) {
          var v1 = num(f.field6), v2 = num(f.field7), v3 = num(f.field8);
          if (v1 !== null && v1 <= 0) v1 = null;
          if (v2 !== null && v2 <= 0) v2 = null;
          if (v3 !== null && v3 <= 0) v3 = null;
          var rf = v1 !== null || v2 !== null;   // brak napięcia = brak odbioru z czujnika zewnętrznego
          return {
            t: new Date(f.created_at).getTime(),
            tIn: num(f.field1), hIn: num(f.field2),
            tOut: rf ? num(f.field3) : null,
            hOut: rf ? num(f.field4) : null,
            p: num(f.field5), v1: v1, v2: v2, v3: v3
          };
        });
        chartObjs.forEach(function (c) { c.showMsg(''); c.setData(rows, med * 60000); });
      })
      .catch(function (err) {
        clearTimeout(timer);
        if (myReq !== chartReq) return;   // zapytanie zastąpione nowszym
        console.error('Błąd pobierania wykresów:', err);
        var text = err && err.name === 'AbortError' ? 'Przekroczono czas – wybierz krótszy zakres' : 'Nie udało się pobrać danych';
        chartObjs.forEach(function (c) { c.showMsg(text); });
      });
  }

  $('range').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    days = parseInt(b.getAttribute('data-days'), 10);
    var all = this.querySelectorAll('button');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('active', all[i] === b);
    loadCharts();
  });

  var rz;
  window.addEventListener('resize', function () {
    clearTimeout(rz);
    rz = setTimeout(function () { chartObjs.forEach(function (c) { c.draw(); }); }, 100);
  });

  applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
  buildCharts();
  loadCharts();
  setInterval(loadCharts, 300000);

  updateData();
  setInterval(updateData, 15000);
  updateTrend();
  setInterval(updateTrend, 600000);
</script>
</body>
</html>
