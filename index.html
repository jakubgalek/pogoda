<!DOCTYPE html>
<html lang='pl'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='icon' href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>'>
    <title>Stacja pogodowa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 25%, #3d7edb 50%, #4a9fe5 75%, #56ccf2 100%);
            color: #FFFFFF;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: float 20s linear infinite;
            pointer-events: none;
        }
        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            text-align: center;
            padding: 1.5em;
            margin-bottom: 2em;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shine 30s infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        h1 {
            font-size: 2.5em;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }
        h3 {
            text-align: center;
            margin: 2.5em 0 1.5em 0;
            font-size: 1.5em;
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5em;
        }
        .data-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin-bottom: 2em;
        }
        .data-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 0;
            flex: 0 1 180px;
            min-height: 140px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .data-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .data-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .data-container:hover::before {
            left: 100%;
        }
        .data-container p {
            margin: 0;
            padding: 1em;
            font-weight: 500;
            font-size: 0.9em;
            background: rgba(255, 255, 255, 0.2);
            color: #FFFFFF;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .data-container span {
            font-size: 2.2em;
            font-weight: 300;
            padding: 0.5em;
            padding-right: 0;
            display: inline-block;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .data-container .unit {
            font-size: 1em;
            padding-left: 0.3em;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 400;
        }
        .weather-guy {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 15%;
            opacity: 0.95;
            animation: floaty 6s ease-in-out infinite;
        }
        @keyframes floaty {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .status {
            text-align: center;
            margin-top: 2em;
            font-size: 0.9em;
            opacity: 0.8;
        }
        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            .data-group { gap: 15px; }
            .data-container {
                flex: 1 1 45%;
                min-width: 150px;
                min-height: 130px;
            }
            .data-container span { font-size: 1.8em; }
            .weather-guy {
                width: 15%;
                right: 1em;
                bottom: 1em;
            }
        }
        @media (max-width: 480px) {
            .data-container {
                flex: 1 1 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🌤️ Stacja pogodowa</h1>
    </header>
    <section>
        <h3><span>🏠</span> W domu</h3>
        <div class='data-group'>
            <div class='data-container'>
                <p>Temperatura</p>
                <span id='temperature'>--</span><span class='unit'>°C</span>
            </div>
            <div class='data-container'>
                <p>Wilgotność</p>
                <span id='humidity'>--</span><span class='unit'>%</span>
            </div>
            <div class='data-container'>
                <p>Ciśnienie</p>
                <span id='pressure'>--</span><span class='unit'>hPa</span>
            </div>
        </div>
    </section>
    <section>
        <h3><span>🌳</span> Na zewnątrz</h3>
        <div class='data-group'>
            <div class='data-container'>
                <p>Temperatura</p>
                <span id='outside_temperature'>--</span><span class='unit'>°C</span>
            </div>
            <div class='data-container'>
                <p>Wilgotność</p>
                <span id='outside_humidity'>--</span><span class='unit'>%</span>
            </div>
            <div class='data-container'>
                <p>Bateria</p>
                <span id='outside_voltage'>--</span><span class='unit'>V</span>
            </div>
        </div>
    </section>
    <div class='status'>
        <p id='last-update'>Ładowanie danych...</p>
    </div>
    <img class='weather-guy' src='https://i.imgur.com/6ElocOl.png' alt='Postać pogody'>
    <script>
        function updateData() {
            fetch('https://thingspeak.mathworks.com/channels/2917455/feed.json?results=1')
                .then(response => response.json())
                .then(data => {
                    if (data.feeds && data.feeds.length > 0) {
                        const latest = data.feeds[0];
                        
                        // W domu (field1, field2, field5)
                        document.getElementById('temperature').innerHTML = latest.field1 || '--';
                        document.getElementById('humidity').innerHTML = latest.field2 || '--';
                        document.getElementById('pressure').innerHTML = latest.field5 || '--';
                        
                        // Na zewnątrz (field3, field4, field6 lub field7)
                        document.getElementById('outside_temperature').innerHTML = latest.field3 || '--';
                        document.getElementById('outside_humidity').innerHTML = latest.field4 || '--';
                        
                        // Wybierz mniejsze napięcie z field6 i field7
                        const voltage1 = parseFloat(latest.field6) || 999;
                        const voltage2 = parseFloat(latest.field7) || 999;
                        const minVoltage = Math.min(voltage1, voltage2);
                        document.getElementById('outside_voltage').innerHTML = minVoltage < 999 ? minVoltage.toFixed(2) : '--';
                        
                        // Ostatnia aktualizacja
                        const updateTime = new Date(latest.created_at);
                        document.getElementById('last-update').innerHTML = 
                            'Ostatnia aktualizacja: ' + updateTime.toLocaleString('pl-PL');
                    }
                })
                .catch(error => {
                    console.error('Błąd pobierania danych:', error);
                    document.getElementById('last-update').innerHTML = 'Błąd połączenia z serwerem';
                });
        }
        
        // Aktualizuj dane co 15 sekund
        updateData();
        setInterval(updateData, 15000);
    </script>
</body>
</html>
